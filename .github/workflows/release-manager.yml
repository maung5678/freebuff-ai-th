name: Build Freebuff Manager

on:
  workflow_dispatch:
  push:
    tags: ['manager-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager-app/package-lock.json
      - run: npm ci
        working-directory: manager-app
      - run: node "Freebuff Thai/tools/build-pack.js"
      - run: npm run build
        working-directory: manager-app
      - uses: actions/upload-artifact@v4
        with:
          name: Freebuff-Manager-Windows
          path: |
            manager-app/dist/*.{exe,blockmap,yml}
            build/Freebuff-Thai-Pack-*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            manager-app/dist/*.{exe,blockmap,yml}
            build/Freebuff-Thai-Pack-*.zip
