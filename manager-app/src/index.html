<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freebuff Manager</title><link rel="stylesheet" href="styles.css"></head><body>
<main><header><div class="brand"><div class="logo">F</div><div><b>Freebuff</b><small>Manager</small></div></div><div class="header-actions"><button class="icon-button" id="check-update" title="ตรวจหาอัปเดต" aria-label="ตรวจหาอัปเดต">↻</button><button class="primary" id="update-all" title="อัปเดตแอปหลัก โคลน และภาษาไทย" disabled><span>↓</span> อัปเดตทั้งหมด</button></div></header>
<section class="overview"><div><p class="eyebrow">FREEBUFF CONTROL CENTER</p><h1>จัดการทุกอย่างในที่เดียว</h1><p class="muted">แอปหลัก <b id="main-version">—</b> <span id="main-update" class="version-state">ยังไม่ได้ตรวจสอบ</span> <button class="icon-button main-open" id="open-main" title="เปิดแอปหลัก" aria-label="เปิดแอปหลัก">↗</button></p></div><div class="version-strip"><div><span>Freebuff</span><b id="desktop-version">—</b></div><div><span>Mod ภาษาไทย</span><b id="language-version">—</b></div><div><span>Manager</span><b id="manager-version">—</b></div></div></section>
<section class="panel"><div class="section-head"><div><h2>แอปโคลน</h2><p class="muted"><span id="count">0</span> โคลน · สร้างบัญชีแยกและอัปเดตพร้อมแอปหลัก</p></div><button class="icon-button subtle" id="refresh" title="รีเฟรชรายการ" aria-label="รีเฟรชรายการ">⟳</button></div><div class="clone-toolbar"><input id="new-clone-name" placeholder="ชื่อโคลน เช่น Freebuff H"><button class="add-button" id="add-clone" title="เพิ่มโคลน" aria-label="เพิ่มโคลน">＋</button></div><div id="account-list"></div></section>
<dialog id="clone-dialog" aria-labelledby="clone-title"><form id="clone-form"><h3 id="clone-title"></h3><p id="clone-description"></p><label id="clone-name-field">ชื่อโคลน<input id="clone-name" autocomplete="off" maxlength="39"></label><p id="clone-error" role="alert"></p><div class="dialog-actions"><button type="button" id="clone-cancel" class="secondary">ยกเลิก</button><button type="submit" id="clone-submit" class="primary">บันทึกชื่อ</button></div></form></dialog>
<footer><span id="version">Manager —</span></footer><button class="log-link" id="activity-button" title="ดูบันทึกกิจกรรม"><i></i><span id="activity-summary">Log</span></button><div id="toast"></div><dialog id="log"><button id="close-log" class="icon-button" title="ปิด">×</button><h3>สถานะและบันทึกกิจกรรม</h3><div class="log-controls"><button id="copy-log" class="secondary">คัดลอก</button><button id="clear-log" class="ghost">ล้าง</button></div><pre id="log-text"></pre></dialog></main><script src="renderer.js"></script></body></html>
